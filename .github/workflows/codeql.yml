# CodeQL analysis for Go (aligned with go-workload-ci core checkout layout).
name: CodeQL

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  schedule:
    - cron: "27 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout shared core
        uses: actions/checkout@v7
        with:
          repository: fluid-pub/agent-core
          ref: develop
          path: core

      - name: Align go.mod replace for CI layout
        run: |
          go mod edit -replace fluid/agents/core=./core
          go mod download

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

name: Release on semver tag

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: fluid-pub/actions/.github/workflows/go-workload-release.yml@v1
    with:
      workload_kind: agent
      binary_name: fluid-agent-proxmox
      core_repository: fluid-pub/agent-core
      # Empty core_ref: checkout agent-core at the same semver tag as this release.
      core_ref: ""
